version: '3.8'

services:
  sarvam-avatar-tutor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sarvam_avatar_tutor
    ports:
      - "8000:8000"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
